<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
<title id="t">Bramble</title>
<desc id="d">The Bramble wordmark beside arching bramble canes whose blackberries are the nodes of a compute mesh.</desc>
<style>
.cap{font:500 16px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.2em;fill:#9C97B0}
.lab{font:500 13.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.06em;fill:#B9B4CB}
.pulse{fill:none;stroke:#EDE7FF;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:2.2 97.8;animation:run 9s linear infinite}
@keyframes run{from{stroke-dashoffset:2.2}to{stroke-dashoffset:-97.8}}
.join{animation:breathe 2.4s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}.join{animation:none}}
</style>
